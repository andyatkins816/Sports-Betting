name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sam
          POSTGRES_USER: sam
          POSTGRES_PASSWORD: sam-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sam -d sam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project-2/pyproject.toml
      - name: Install
        working-directory: project-2
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,modeling]'
      - name: Apply PostgreSQL migrations
        working-directory: project-2
        env:
          DATABASE_URL: postgresql://sam:sam-ci-password@127.0.0.1:5432/sam
        run: python -m sam_analytics.migrate
      - name: Lint
        working-directory: project-2
        # The legacy demo application remains in the repository for reference,
        # but the production route is the SAM package plus its API/worker
        # entry points. Keep the gate focused on code that can ship.
        # E501 is deliberately ignored in pyproject.toml. Passing --select
        # on the command line otherwise re-enables it, which makes the CI
        # rule differ from the documented local policy.
        run: ruff check --select E,F --ignore E501 sam_analytics routes/api.py app.py worker.py provider_worker.py
      - name: Test
        working-directory: project-2
        # `python -m` preserves this application directory on the import
        # path, allowing tests to exercise the API entry point as deployed.
        # The disposable PostgreSQL instance also verifies that the immutable
        # provider-receipt transaction agrees with the checked-in migrations.
        env:
          DATABASE_URL: postgresql://sam:sam-ci-password@127.0.0.1:5432/sam
        run: python -m pytest
      - name: Security scan
        working-directory: project-2
        run: bandit -q -r sam_analytics routes app.py worker.py provider_worker.py
      - name: Validate opt-in worker Compose profile
        run: |
          cp .env.example .env
          cp .env.worker.example .env.worker
          docker compose --profile private-worker config --quiet
      - name: Build container
        run: docker build --tag sam-analytics:${{ github.sha }} project-2
      - name: Smoke-test private worker container
        run: |
          trap 'docker rm -f sam-worker-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name sam-worker-ci --network host \
            --env APP_ENV=staging \
            --env DATABASE_URL=postgresql://sam:sam-ci-password@127.0.0.1:5432/sam \
            --env REDIS_URL=redis://127.0.0.1:6379/15 \
            --env SAM_WORKER_ROLE=private_ingestion \
            --env SAM_WORKER_MODE=synthetic_storage_probe \
            --env SAM_INGESTION_ENABLED=false \
            --env SAM_RAW_EVIDENCE_STORE_BACKEND=cloudflare_r2 \
            --env SAM_RAW_EVIDENCE_STORE_URI=s3://sam-raw-evidence-staging/raw/synthetic \
            --env SAM_RAW_EVIDENCE_S3_REGION=auto \
            --env SAM_RAW_EVIDENCE_S3_ENDPOINT_URL=https://0123456789abcdef0123456789abcdef.r2.cloudflarestorage.com \
            --env SAM_RAW_EVIDENCE_MAX_BYTES=1048576 \
            --env SAM_RAW_EVIDENCE_S3_ACCESS_KEY_ID=ci-scoped-r2-access-id \
            --env SAM_RAW_EVIDENCE_S3_SECRET_ACCESS_KEY=ci-scoped-r2-secret \
            sam-analytics:${{ github.sha }} \
            celery -A worker:celery_app worker --loglevel=INFO --concurrency=1 \
              --queues=sam_manual_shadow --without-gossip --without-mingle
          for attempt in $(seq 1 30); do
            if docker logs sam-worker-ci 2>&1 | grep -q ' ready\.'; then
              test "$(docker inspect --format '{{.State.Running}}' sam-worker-ci)" = true
              exit 0
            fi
            if test "$(docker inspect --format '{{.State.Running}}' sam-worker-ci)" != true; then
              docker logs sam-worker-ci
              exit 1
            fi
            sleep 1
          done
          docker logs sam-worker-ci
          exit 1
      - name: Smoke-test provider-shadow worker container
        run: |
          trap 'docker rm -f sam-provider-worker-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name sam-provider-worker-ci --network host \
            --add-host red-sam-test:127.0.0.1 \
            --env APP_ENV=staging \
            --env DATABASE_URL=postgresql://sam:sam-ci-password@dpg-sam-test-a/sam \
            --env REDIS_URL=redis://red-sam-test:6379/0 \
            --env SAM_WORKER_ROLE=private_ingestion \
            --env SAM_WORKER_MODE=provider_shadow \
            --env SAM_INGESTION_ENABLED=true \
            --env ODDS_PROVIDER=the_odds_api \
            --env ODDS_PROVIDER_API_KEY=ci-provider-key \
            --env SAM_ODDS_SPORT_KEY=baseball_mlb \
            --env SAM_ODDS_REGIONS=us \
            --env SAM_ODDS_MARKETS=h2h \
            --env SAM_PROVIDER_LICENSE_SCOPE=internal_analytics_only \
            --env SAM_PROVIDER_LICENSE_VERSION=terms-2026-08-31 \
            --env SAM_RAW_EVIDENCE_STORE_BACKEND=cloudflare_r2 \
            --env SAM_RAW_EVIDENCE_STORE_URI=s3://sam-raw-evidence-staging/raw/the_odds_api \
            --env SAM_RAW_EVIDENCE_S3_REGION=auto \
            --env SAM_RAW_EVIDENCE_S3_ENDPOINT_URL=https://0123456789abcdef0123456789abcdef.r2.cloudflarestorage.com \
            --env SAM_RAW_EVIDENCE_MAX_BYTES=10485760 \
            --env SAM_RAW_EVIDENCE_S3_ACCESS_KEY_ID=ci-scoped-r2-access-id \
            --env SAM_RAW_EVIDENCE_S3_SECRET_ACCESS_KEY=ci-scoped-r2-secret \
            sam-analytics:${{ github.sha }} \
            celery -A provider_worker:celery_app worker --beat --loglevel=INFO --concurrency=1 \
              --queues=sam_provider_shadow --without-gossip --without-mingle
          for attempt in $(seq 1 30); do
            if docker logs sam-provider-worker-ci 2>&1 | grep -q ' ready\.'; then
              test "$(docker inspect --format '{{.State.Running}}' sam-provider-worker-ci)" = true
              exit 0
            fi
            if test "$(docker inspect --format '{{.State.Running}}' sam-provider-worker-ci)" != true; then
              docker logs sam-provider-worker-ci
              exit 1
            fi
            sleep 1
          done
          docker logs sam-provider-worker-ci
          exit 1
      - name: Smoke-test container
        run: |
          docker run --detach --name sam-ci \
            --env PORT=10000 \
            --env APP_ENV=staging \
            --env SESSION_SECRET=ci-session-secret-at-least-32-characters \
            --env SAM_API_KEY=ci-research-key \
            --env SAM_STATUS_API_KEY=ci-status-key-is-distinct \
            --publish 10000:10000 sam-analytics:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/api/healthz; then
              docker stop sam-ci
              exit 0
            fi
            sleep 1
          done
          docker logs sam-ci
          docker stop sam-ci
          exit 1
