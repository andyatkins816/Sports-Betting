[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-analytics"
version = "0.2.0"
description = "Auditable, provider-neutral sports-market research backend"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "alembic>=1.14,<2",
    "celery[redis]>=5.4,<6",
    "Flask>=3.0,<4",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
modeling = [
    # The deployment image installs this extra so every candidate is available
    # to the isolated training worker.  The runtime still fails closed if the
    # dependency is absent rather than substituting a synthetic model.
    "scikit-learn>=1.5,<2",
]
dev = [
    "bandit[toml]>=1.7,<2",
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests"]
